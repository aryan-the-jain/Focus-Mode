<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Blocked</title>
    <link rel="stylesheet" href="blocked.css">
</head>

<body>
    <main class="wrap">
        <div class="mark" aria-hidden="true"></div>
        <h1 id="title">Checking…</h1>
        <p class="sub" id="sub"></p>
        <div class="meter" id="meter" hidden>
            <div class="bar"><div id="bar-fill"></div></div>
            <p class="meter-label" id="meter-label"></p>
        </div>
        <div class="actions" id="work" hidden>
            <p class="actions-label">Start now</p>
            <div class="action-row">
                <button class="btn btn-solid" data-profile="scholar" data-minutes="50">Scholar · 50m</button>
                <button class="btn btn-solid" data-profile="sidequest" data-minutes="50">Side Quest · 50m</button>
            </div>
        </div>
        <a class="btn" id="open-focus" href="http://localhost:7878" target="_blank">Open Focus</a>
    </main>
    <script src="blocked.js"></script>
</body>

</html>
